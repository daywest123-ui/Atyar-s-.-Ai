name: At Yarisi AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/analyze.yml'
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect daily program and historical form
        run: python src/collector.py
      - name: Validate collected program
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("data/horses.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Yarış verisi 0 kayıt: pipeline durduruldu")
          races = {str(r.get("race_number") or r.get("race")) for r in rows}
          print(f"Validated {len(rows)} horses across {len(races)} races")
          PY
      - name: Backfill historical TJK results
        env:
          BACKFILL_DAYS: "7"
        run: python src/results_backfill.py
      - name: Archive historical race results
        run: python src/archive_results.py
      - name: Build training data from historical results
        run: python src/build_training.py
      - name: Run model audit
        run: python src/model_audit.py > data/model_audit.json
      - name: Run integrated advanced analysis
        run: python src/main.py
      - name: Build race summaries and 6li coupons
        run: python src/advanced_pipeline.py
      - name: Run leakage-aware archive diagnostics
        run: python src/backtest.py > data/backtest_report.json
      - name: Persist training and archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Backfill TJK historical results and retrain dataset"
          git push || true
      - name: Upload analysis data
        uses: actions/upload-artifact@v4
        with:
          name: at-yarisi-analysis
          path: |
            data/*.json
            data/*.csv
          retention-days: 7

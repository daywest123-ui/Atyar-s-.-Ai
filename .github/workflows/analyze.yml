name: At Yarisi AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect daily program and historical form
        run: python src/collector.py
      - name: Validate collected program
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/horses.json")
          if not p.exists():
              raise SystemExit("data/horses.json oluşturulmadı")
          rows = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(rows, list) or len(rows) == 0:
              raise SystemExit("Yarış verisi 0 kayıt: pipeline durduruldu")
          races = {str(r.get("race_number") or r.get("race")) for r in rows}
          print(f"Validated {len(rows)} horses across {len(races)} races")

      - name: Archive historical race results
        run: python src/archive_results.py
      - name: Build training data from archived results
        run: python src/build_training.py
      - name: Run integrated advanced analysis
        run: python src/main.py
      - name: Build race summaries and 6li coupons
        run: python src/advanced_pipeline.py
      - name: Run leakage-aware archive diagnostics
        run: python src/backtest.py > data/backtest_report.json
      - name: Persist training and archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update horse racing analysis, 6li optimizer and archive"
          git push || true
      - name: Upload analysis data
        uses: actions/upload-artifact@v4
        with:
          name: at-yarisi-analysis
          path: |
            data/*.json
            data/*.csv
          retention-days: 7

name: At Yarisi AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect daily program and historical form
        run: python src/collector.py
      - name: Rank horses
        run: python src/main.py
      - name: Upload analysis data
        uses: actions/upload-artifact@v4
        with:
          name: at-yarisi-analysis
          path: data/*.json
          retention-days: 7

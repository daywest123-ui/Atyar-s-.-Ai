name: At Yarisi AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Analyze
        run: python src/main.py
